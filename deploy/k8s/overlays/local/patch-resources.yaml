# Relax resource requests/limits for a single-node dev cluster: tiny requests so
# everything schedules on a laptop, generous limits so nothing gets throttled or
# OOM-killed while you are poking at it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  template:
    spec:
      initContainers:
        - name: wait-for-db
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 500m
              memory: 128Mi
      containers:
        - name: backend
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              cpu: "2"
              memory: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  template:
    spec:
      containers:
        - name: frontend
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  template:
    spec:
      containers:
        - name: postgres
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              cpu: "2"
              memory: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: zapsign-migrate
spec:
  template:
    spec:
      initContainers:
        - name: wait-for-db
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 500m
              memory: 128Mi
      containers:
        - name: migrate
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              cpu: "2"
              memory: 1Gi
