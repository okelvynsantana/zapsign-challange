[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "zapsign-backend"
version = "0.1.0"
description = "Document & Signature Management System — Django + DRF backend"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "Django>=5.0,<5.3",
    "djangorestframework>=3.15",
    "djangorestframework-simplejwt>=5.3",
    "djangorestframework-api-key>=3.0",
    "openai>=1.40",
    "pypdf>=4.2",
    "httpx>=0.27",
    "psycopg[binary]>=3.1",
    "python-json-logger>=3.1",
    "django-cors-headers>=4.4",
    "drf-spectacular>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-django>=4.8",
    "pytest-cov>=5.0",
    "factory-boy>=3.3",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "django-stubs>=5.0",
    "djangorestframework-stubs>=3.15",
    "types-requests>=2.32",
]

[tool.setuptools]
zip-safe = false

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "config*"]
exclude = ["tests*"]

# ---------------------------------------------------------------------------------------
# Ruff — lint + format (replaces flake8 + isort + black)
# ---------------------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]
extend-exclude = [".venv", "staticfiles"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "N",    # pep8-naming
    "ANN",  # flake8-annotations (explicit type hints — research.md §9)
    "C4",   # flake8-comprehensions
    "DJ",   # flake8-django
    "RUF",  # ruff-specific
]
ignore = [
    "ANN401",  # allow explicit `Any` where Django's dynamic API requires it
    # Django and DRF declare list/dict class attributes everywhere by design
    # (`Meta.constraints`, `authentication_classes`, `permission_classes`, …).
    # Annotating each one `ClassVar` fights the framework for no safety gain.
    "RUF012",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["ANN", "S101", "N802"]
"**/test_*.py" = ["ANN", "S101", "N802"]
"conftest.py" = ["ANN", "S101"]
"**/conftest.py" = ["ANN", "S101"]
"**/migrations/*.py" = ["ANN", "E501", "N806", "RUF012"]
"config/settings/*.py" = ["F403", "F405"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

# ---------------------------------------------------------------------------------------
# mypy — pragmatic-strict (research.md §9)
# ---------------------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
disallow_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
warn_redundant_casts = true
ignore_missing_imports = true
show_error_codes = true
exclude = ["^\\.venv/", "^staticfiles/"]

[[tool.mypy.overrides]]
module = ["apps.*.migrations.*"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["*.tests.*", "tests.*", "conftest"]
disallow_untyped_defs = false

[tool.django-stubs]
django_settings_module = "config.settings.local"

# ---------------------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------------------
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.local"
python_files = ["test_*.py"]
testpaths = ["apps", "tests"]
addopts = "-q"

# ---------------------------------------------------------------------------------------
# coverage
# ---------------------------------------------------------------------------------------
[tool.coverage.run]
source = ["apps"]
branch = true
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/test_*.py",
    "config/settings/*",
    "manage.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
