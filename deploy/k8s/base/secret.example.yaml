# ---------------------------------------------------------------------------
# EXAMPLE ONLY — DO NOT COMMIT REAL SECRETS.
#
# Every value below is a placeholder. Real credentials MUST NEVER be committed to
# this repository (Constitution: "Sensitive configuration MUST be supplied via
# environment variables / Secrets and MUST NOT be committed").
#
# Create the real Secret out-of-band, e.g.:
#
#   kubectl -n zapsign create secret generic zapsign-secrets \
#     --from-literal=DJANGO_SECRET_KEY="$(openssl rand -base64 48)" \
#     --from-literal=POSTGRES_PASSWORD='<db password>' \
#     --from-literal=OPENAI_API_KEY='<openai key>' \
#     --from-literal=N8N_WEBHOOK_SECRET='<webhook shared secret>' \
#     --from-literal=SEED_PASSWORD='<initial admin password>'
#
# ...or manage it through a GitOps-safe flow such as Bitnami Sealed Secrets or the
# External Secrets Operator (ESO), which keeps only encrypted/indirect references
# in git. This file exists solely to document the required keys and to let
# `kustomize build` render a complete stack for review.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: zapsign-secrets
  labels:
    app.kubernetes.io/name: zapsign
type: Opaque
stringData:
  DJANGO_SECRET_KEY: "REPLACE_ME_django_secret_key"
  POSTGRES_PASSWORD: "REPLACE_ME_postgres_password"
  OPENAI_API_KEY: "REPLACE_ME_openai_api_key"
  N8N_WEBHOOK_SECRET: "REPLACE_ME_n8n_webhook_secret"
  SEED_PASSWORD: "REPLACE_ME_seed_password"
