# One-shot migration + seed job.
#
# Uses the same image and environment as the backend Deployment. Run it before (or
# alongside) a rollout; the backend pods themselves never run migrations, so
# replicas cannot race each other.
#
# NOTE: a Job's `spec.template` is immutable. To re-run after a change:
#   kubectl -n zapsign delete job zapsign-migrate --ignore-not-found
#   kubectl apply -k deploy/k8s/overlays/<local|prod>
apiVersion: batch/v1
kind: Job
metadata:
  name: zapsign-migrate
  labels:
    app.kubernetes.io/name: zapsign-migrate
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 604800 # keep logs for a week, then clean up
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zapsign-migrate
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-db
          image: ghcr.io/OWNER/zapsign-backend:latest
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -c
            - |
              import os, socket, sys, time
              host = os.environ["POSTGRES_HOST"]
              port = int(os.environ.get("POSTGRES_PORT", "5432"))
              deadline = time.time() + 180
              while time.time() < deadline:
                  try:
                      with socket.create_connection((host, port), timeout=3):
                          sys.exit(0)
                  except OSError:
                      time.sleep(2)
              sys.exit("database %s:%s not reachable" % (host, port))
          envFrom:
            - configMapRef:
                name: zapsign-config
            - secretRef:
                name: zapsign-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
      containers:
        - name: migrate
          image: ghcr.io/OWNER/zapsign-backend:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - python manage.py migrate --noinput && python manage.py seed_user
          envFrom:
            - configMapRef:
                name: zapsign-config
            - secretRef:
                name: zapsign-secrets
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: tmp
          emptyDir: {}
