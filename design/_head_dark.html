<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
  <style>
    :root{
      --paper:#141311;--surface:#1C1B18;--surface-2:#23221E;
      --ink:#F0EDE7;--ink-2:#ADA79E;--ink-3:#7C766E;
      --line:#302E29;--line-2:#423F39;
      --accent:#A79BF0;--accent-ink:#C7BEFA;--accent-soft:#272238;
      --ok-ink:#8FD9B4;--ok-bg:#14251D;--ok-line:#22452F;
      --warn-ink:#E8C078;--warn-bg:#2A2013;--warn-line:#4A3A1D;
      --bad-ink:#F0A79A;--bad-bg:#2B1815;--bad-line:#4C2721;
      --mut-ink:#ADA79E;--mut-bg:#23221E;--mut-line:#37342F;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--paper);color:var(--ink);font:400 13px/1.5 "IBM Plex Sans",system-ui,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;text-wrap:pretty}
    a{color:#A79BF0;text-decoration:none} a:hover{color:#C7BEFA;text-decoration:underline}
    h1,h2,h3,h4,h5{margin:0;font-weight:600;letter-spacing:-0.012em}
    p{margin:0}
    ul,ol{margin:0;padding:0;list-style:none}
    .mono{font-family:"IBM Plex Mono","SFMono-Regular",monospace}
    .eyebrow{font:500 10px/1 "IBM Plex Mono",monospace;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3)}
    .badge{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:3px;border:1px solid;font:500 11px/1 "IBM Plex Mono",monospace;letter-spacing:.01em;white-space:nowrap}
    .b-pending{color:var(--mut-ink);background:var(--mut-bg);border-color:var(--mut-line)}
    .b-ok{color:var(--ok-ink);background:var(--ok-bg);border-color:var(--ok-line)}
    .b-bad{color:var(--bad-ink);background:var(--bad-bg);border-color:var(--bad-line)}
    .b-risk{color:var(--warn-ink);background:var(--warn-bg);border-color:var(--warn-line)}
    .sig{display:inline-flex;align-items:center;gap:7px;font:500 11px/1 "IBM Plex Mono",monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
    .sig i{width:7px;height:7px;border-radius:50%;display:block;border:1.5px solid var(--line-2);background:transparent}
    .sig i.f{background:#5FBF91;border-color:#5FBF91}
    .sig i.r{background:#D9776A;border-color:#D9776A}
    .sig.none{color:var(--ink-3)}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:32px;padding:0 12px;border-radius:4px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font:500 12.5px/1 "IBM Plex Sans",sans-serif;cursor:pointer}
    .btn:hover{border-color:var(--ink-3)}
    .btn-p{background:var(--accent);border-color:var(--accent);color:#fff}
    .btn-p:hover{background:var(--accent-ink);border-color:var(--accent-ink)}
    .btn-d{color:var(--bad-ink);border-color:var(--bad-line)}
    .btn-d:hover{border-color:var(--bad-ink)}
    .btn-s{height:26px;padding:0 9px;font-size:11.5px;gap:5px}
    .btn-i{width:26px;padding:0}
    .nav{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 11px;border-radius:4px;color:var(--ink-2);font-weight:500;font-size:13px}
    .nav:hover{background:var(--surface-2);color:var(--ink);text-decoration:none}
    .nav.on{background:var(--accent-soft);color:var(--accent-ink)}
    .nav em{font-style:normal;font-family:"IBM Plex Mono",monospace;font-size:10.5px;font-weight:600;color:var(--warn-ink);background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:99px;padding:1px 5px}
    .fld{display:flex;flex-direction:column;gap:6px}
    .fld > span{font:500 11.5px/1.2 "IBM Plex Sans",sans-serif;color:var(--ink-2)}
    .fld > small{font:400 11px/1.35 "IBM Plex Sans",sans-serif;color:var(--ink-3)}
    .inp{display:flex;align-items:center;height:34px;padding:0 10px;border:1px solid var(--line-2);border-radius:4px;background:var(--surface);font-size:13px;color:var(--ink)}
    .inp.ph{color:var(--ink-3)}
    .inp.bad{border-color:var(--bad-ink);background:#FFFCFB}
    .inp.foc{border-color:var(--accent);box-shadow:0 0 0 3px rgba(167,155,240,.20)}
    .sel{display:flex;align-items:center;justify-content:space-between;gap:10px;height:32px;padding:0 9px 0 11px;border:1px solid var(--line-2);border-radius:4px;background:var(--surface);font-size:12.5px;color:var(--ink)}
    .sel.ph{color:var(--ink-3)}
    .card{background:var(--surface);border:1px solid var(--line);border-radius:6px}
    table{width:100%;border-collapse:collapse}
    th{font:500 10px/1 "IBM Plex Mono",monospace;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);text-align:left;padding:0 14px 9px;border-bottom:1px solid var(--line-2)}
    td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
    tr.on td{background:var(--accent-soft)}
    .docname{font-weight:600;font-size:13px;color:var(--ink)}
    .ref{font:400 10.5px/1 "IBM Plex Mono",monospace;color:var(--ink-3);letter-spacing:.02em}
    .err{font:400 11.5px/1.4 "IBM Plex Sans",sans-serif;color:var(--bad-ink)}
    .chip{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:3px;border:1px dashed var(--line-2);background:var(--surface-2);font:400 11.5px/1 "IBM Plex Sans",sans-serif;color:var(--ink-2)}
    .kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:9px 14px;align-items:baseline}
    .kv dt{font:500 10px/1.4 "IBM Plex Mono",monospace;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3)}
    .kv dd{margin:0;font-size:12.5px;color:var(--ink);overflow-wrap:anywhere}
  </style>
</helmet>
